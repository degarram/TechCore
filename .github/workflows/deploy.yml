name: Build and Deploy to GitHub Pages

on:
  # Se ejecuta al hacer push a la rama principal
  push:
    branches: ["main"]
  # Permite ejecutarlo manualmente desde la pestaña "Actions"
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Cancela despliegues anteriores si haces varios commits rápidos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------
  # TRABAJO 1: Construcción con Vite
  # ---------------------------------------------------
  build:
    name: Build Project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node.js con caché
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el proyecto (Vite)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        
      - name: Empaquetar artefacto (carpeta dist)
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist' # Vite genera todo automáticamente en esta carpeta
          retention-days: 1

  # ---------------------------------------------------
  # TRABAJO 2: Despliegue en GitHub Pages
  # ---------------------------------------------------
  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
