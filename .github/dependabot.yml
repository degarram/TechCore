version: 2
updates:
  # 1. Dependencias web (NPM)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    target-branch: "main"
    assignees:
      - "degarram"
    labels:
      - "dependencias"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "auto"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "bootstrap"
        update-types: ["version-update:semver-major"]
    groups:
      actualizaciones-seguras:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. Entorno de desarrollo (Dev Containers)
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    assignees:
      - "degarram"
    labels:
      - "dependencias"
      - "dev-env"
    commit-message:
      prefix: "chore(devcontainer)"
    rebase-strategy: "auto"
    open-pull-requests-limit: 2

  # 3. Flujos de despliegue (GitHub Actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    assignees:
      - "degarram"
    labels:
      - "dependencias"
      - "ci-cd"
    commit-message:
      prefix: "cd(actions)"
    rebase-strategy: "auto"
    open-pull-requests-limit: 2
    groups:
      actualizaciones-actions:
        patterns:
          - "*"
